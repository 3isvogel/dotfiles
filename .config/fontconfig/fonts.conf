<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
	<alias>
		<family>monospace</family>
		<prefer>

	<!-- Sets Fira Code as preferred font for monospace -->
	<!-- List available for monospace:
		`fc-cache -fv` and `fc-match monospace` -->
	<!-- List all available fonts:
		`fc-list : family` -->

			<family>Fira Code </family>
		</prefer>
	</alias>
</fontconfig>
